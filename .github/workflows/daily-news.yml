name: Daily Gaming News

on:
  schedule:
    - cron: "50 0 * * *"  # 8:50 AM Beijing time (UTC+8)
  workflow_dispatch:       # Allow manual trigger

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Generate report & push to WeChat
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python3 fetch_and_send.py

      - name: Commit report
        run: |
          git config user.name "Game News Bot"
          git config user.email "news-bot@game-daily.dev"
          git add *.md insights/
          git diff --staged --quiet || git commit -m "Daily report $(date +%Y-%m-%d)"
          git push
