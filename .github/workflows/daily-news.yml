name: Daily Gaming News

on:
  schedule:
    - cron: "58 0 * * *"  # 8:58 AM Beijing time (UTC+8)
  workflow_dispatch:       # Allow manual trigger

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests feedparser

      - name: Generate report & push to WeChat
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python3 fetch_and_send.py

      - name: Send email
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          python3 -c "
          import smtplib, os
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from datetime import datetime

          date_str = datetime.now().strftime('%Y-%m-%d')
          filepath = f'{date_str}.md'

          with open(filepath, 'r', encoding='utf-8') as f:
              body = f.read()

          msg = MIMEMultipart()
          msg['From'] = 'xyokokok@163.com'
          msg['To'] = 'xyokokok@163.com'
          msg['Subject'] = f'🎮 游戏行业日报 {date_str}'
          msg.attach(MIMEText(body, 'plain', 'utf-8'))

          server = smtplib.SMTP_SSL('smtp.163.com', 465)
          server.login('xyokokok@163.com', os.environ['SMTP_PASS'])
          server.sendmail('xyokokok@163.com', 'xyokokok@163.com', msg.as_string())
          server.quit()
          print('Email sent')
          "

      - name: Commit report
        run: |
          git config user.name "Game News Bot"
          git config user.email "news-bot@game-daily.dev"
          git add *.md
          git diff --staged --quiet || git commit -m "Daily report $(date +%Y-%m-%d)"
          git push
